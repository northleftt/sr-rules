name: Update CN direct list
on:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Convert
        run: |
          curl -fsSL https://raw.githubusercontent.com/Loyalsoldier/surge-rules/release/direct.txt -o /tmp/direct.txt
          {
            echo "# 国内域名直连列表（由 Loyalsoldier direct.txt 转换，区分精确域名与后缀，Actions 每周自动更新）"
            awk '/^[[:space:]]*(#|$)/ { next } /^\./ { print "DOMAIN-SUFFIX," substr($0, 2); next } { print "DOMAIN," $0 }' /tmp/direct.txt
          } > sr/china-direct.list
      - name: Commit
        run: |
          git config user.name "rules-bot"
          git config user.email "bot@users.noreply.github.com"
          git add sr/china-direct.list
          git diff --cached --quiet || git commit -m "chore: weekly refresh china-direct list"
          git push
